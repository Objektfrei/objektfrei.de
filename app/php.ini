; Objektfrei – abgesicherte PHP-Einstellungen
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/objektfrei/log/php-fehler.log

; Uploads: 5 Bilder à 8 MB plus Formularfelder
file_uploads = On
upload_max_filesize = 8M
post_max_size = 30M
max_file_uploads = 6
memory_limit = 256M
max_execution_time = 60

; Angriffsfläche verkleinern
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec
session.cookie_httponly = On
session.cookie_secure = On

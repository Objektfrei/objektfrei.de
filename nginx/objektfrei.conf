server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /srv;
    index index.html;

    # Traefik ist der einzige Zugang (keine Ports veröffentlicht), deshalb darf
    # dessen X-Forwarded-For vertraut werden. Ohne das sähe anfrage.php nur die
    # Traefik-IP und das Rate-Limit würde für alle Besucher gemeinsam greifen.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # post_max_size in app/php.ini ist 30M.
    client_max_body_size 32m;

    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "SAMEORIGIN"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Das Formular. Die Datei liegt im PHP-Image unter /app und damit außerhalb
    # des Webverzeichnisses – nginx kennt sie nur als FastCGI-Ziel.
    location = /anfrage.php {
        include       fastcgi_params;
        fastcgi_pass  php:9000;
        fastcgi_param SCRIPT_FILENAME /app/anfrage.php;
        fastcgi_param SCRIPT_NAME     /anfrage.php;
        fastcgi_param DOCUMENT_ROOT   /app;
        fastcgi_read_timeout 120s;
    }

    # Sonst wird kein PHP ausgeführt.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # Kein add_header hier: ein add_header im Block ersetzt die oben gesetzten
    # Sicherheits-Header komplett. `expires` erzeugt Cache-Control von selbst.
    location ~* \.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Statische Seite: /impressum liefert impressum.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
